schema:
  pk: xy_group_id
  tables:
    xy_point:
      format: gpkg
      geometry: true
      cardinality: spatial
      fields:
      - xy_group_id
      - lon
      - lat
      - pais_grupo
      - id_0
      - id_1
      - id_2
      derive_classes_from:
        id_0: nivel_0_dominante
        id_1: nivel_1_dominante
        id_2: nivel_2_dominante
    xy_core:
      format: csv
      cardinality: '1:1'
      fields:
      - xy_group_id
      - estado_xy_subset
      - tipo_grupo_original
      - n_registros_original
      - n_registros_subset
      - n_registros
      - n_fuentes
      - pais_dominante
      - fuente_dominante
    xy_temporal:
      format: csv
      cardinality: '1:1'
      fields:
      - xy_group_id
      - n_anios
      - anio_min
      - anio_max
      - distancia_minima_2020
      - incluye_2020
      - incluye_2018_2022
    xy_clase_resumen:
      format: csv
      cardinality: '1:1'
      fields:
      - xy_group_id
      - n_nivel0
      - n_nivel1
      - n_nivel2
      - conf_integrada_promedio
      - n_registros_pais_clase
      - estado_pais_clase
    xy_spectral:
      format: csv
      cardinality: '1:1'
      fields:
      - xy_group_id
      - n_extract_units_spectral
      - n_spectral_rows
      - spectral_severity_order_max
      - spectral_alert_count_sum
      - pct_extract_units_sin_alerta
      - pct_extract_units_alerta_baja
      - pct_extract_units_alerta_media
      - pct_extract_units_alerta_alta
      - pct_extract_units_baja_disponibilidad
      - pct_extract_units_sin_datos
      - pct_extract_units_revision_espectral
      - s2yr_months_obs_median
      - s2yr_obs_total_median
      - s2yr_obs_mean_median
      - s2yr_cloudprob_median
      - s2yr_ndvi_mean
      - s2yr_ndvi_median
      - s2yr_ndvi8a_mean
      - s2yr_ndvi8a_median
      - s2yr_ndre_mean
      - s2yr_ndre_median
      - spectral_alert_level_max
    xy_score:
      format: csv
      cardinality: '1:1'
      fields:
      - xy_group_id
      - score_temporal
      - score_espectral
      - score_prioridad_revision
      - score_espacial
      - score_consistencia_clase
      - score_viabilidad_clase
      - score_claridad_semantica
      - score_nivel_leyenda
      - score_tematico
      - score_confiabilidad
      - score_representatividad
      - score_fuente
      - score_aptitud_raw
      - score_cap
      - cap_reason
      - score_aptitud_total
    xy_conflicto:
      format: csv
      cardinality: '1:1'
      fields:
      - xy_group_id
      - tipo_conflicto
      - severidad_conflicto
      - flag_conflicto_activo
      - flag_clase_residual
    xy_accion:
      format: csv
      cardinality: '1:1'
      fields:
      - xy_group_id
      - categoria_aptitud_preliminar
      - categoria_uso_actividad_1_8
      - definicion_categoria_aptitud
      - accion_recomendada
      - razon_categoria_aptitud
  field_types:
    text:
    - xy_group_id
    - pais_grupo
    - estado_xy_subset
    - tipo_grupo_original
    - pais_dominante
    - fuente_dominante
    - nivel_0_dominante
    - nivel_1_dominante
    - nivel_2_dominante
    - valores_nivel_0
    - valores_nivel_1
    - valores_nivel_2
    - nivel_0
    - nivel_0_propuesta
    - nivel_1
    - nivel_2
    - estado_pais_clase
    - spectral_alert_level_max
    - tipo_conflicto
    - severidad_conflicto
    - cap_reason
    - categoria_aptitud_preliminar
    - categoria_uso_actividad_1_8
    - definicion_categoria_aptitud
    - accion_recomendada
    - razon_categoria_aptitud
    integer:
    - id_0
    - id_0_propuesta
    - id_1
    - id_2
    - n_registros_original
    - n_registros_subset
    - n_registros
    - n_fuentes
    - n_anios
    - anio_min
    - anio_max
    - distancia_minima_2020
    - n_nivel0
    - n_nivel1
    - n_nivel2
    - n_extract_units_spectral
    - n_spectral_rows
    - spectral_severity_order_max
    - spectral_alert_count_sum
    - n_registros_pais_clase
    float:
    - lon
    - lat
    - score_temporal
    - conf_integrada_promedio
    - pct_extract_units_sin_alerta
    - pct_extract_units_alerta_baja
    - pct_extract_units_alerta_media
    - pct_extract_units_alerta_alta
    - pct_extract_units_baja_disponibilidad
    - pct_extract_units_sin_datos
    - pct_extract_units_revision_espectral
    - s2yr_months_obs_median
    - s2yr_obs_total_median
    - s2yr_obs_mean_median
    - s2yr_cloudprob_median
    - s2yr_ndvi_mean
    - s2yr_ndvi_median
    - s2yr_ndvi8a_mean
    - s2yr_ndvi8a_median
    - s2yr_ndre_mean
    - s2yr_ndre_median
    - score_espectral
    - score_prioridad_revision
    - score_espacial
    - score_consistencia_clase
    - score_viabilidad_clase
    - score_claridad_semantica
    - score_nivel_leyenda
    - score_tematico
    - score_confiabilidad
    - score_representatividad
    - score_fuente
    - score_aptitud_raw
    - score_cap
    - score_aptitud_total
    boolean:
    - incluye_2020
    - incluye_2018_2022
    - flag_conflicto_activo
    - flag_clase_residual
proposed_class_homologation:
  description: Homologación N:1 entre las clases de origen de nivel 0 y la clasificación propuesta de nivel 0.
  source_level: 0
  source_id_field: id_0
  target_id_field: id_0_propuesta
  target_label_field: nivel_0_propuesta
  target_table: clase_propuesta_nivel_0
  mapping_table: homologacion_nivel_0_origen_propuesta
  require_complete_source_mapping: true
  classes:
  - id_0_propuesta: 0
    nivel_0_propuesta: No Bosque
  - id_0_propuesta: 1
    nivel_0_propuesta: Bosque/Tierras forestales
  mapping:
  - id_0: 10
    id_0_propuesta: 0
  - id_0: 20
    id_0_propuesta: 0
  - id_0: 30
    id_0_propuesta: 0
  - id_0: 40
    id_0_propuesta: 1
  - id_0: 90
    id_0_propuesta: 0
