activity: a2_1_modelo_datos
input:
  gpkg: data/processed/scoring_aptitud/10_scoring_aptitud_outputs.gpkg
  layer: xy_group_aptitude_master
output:
  processed_dir: data/processed/a2_1_modelo_datos
  reports_dir: outputs/reports
  logs_dir: logs
  gpkg_dir: gpkg
  tables_dir: tables
  metadata_dir: metadata
  spatial_gpkg: a2_1_xy_point.gpkg
  spatial_layer: xy_point
  write_tables_to_gpkg: true
  create_join_indexes: true
  overwrite: true
validation:
  strict_schema: true
  require_unique_pk: true
  require_non_null_pk: true
  warn_extra_fields: true
  fail_on_unknown_class_code: false
  validate_dominante_vs_valores: true
  fail_on_dominante_valores_mismatch: false
  fail_on_unmapped_proposed_level0: true
normalization:
  code_regex: ^\s*(?P<cod>\d{2,3})\b.*$
  split_regex: \s*(?:\||;)\s*
  empty_values:
  - ''
  - nan
  - none
  - 'null'
  - sin_dato
  - sin dato
  - no_definido
  class_fk_sources:
    id_0:
      level: 0
      dominante: nivel_0_dominante
      valores: valores_nivel_0
    id_1:
      level: 1
      dominante: nivel_1_dominante
      valores: valores_nivel_1
    id_2:
      level: 2
      dominante: nivel_2_dominante
      valores: valores_nivel_2
