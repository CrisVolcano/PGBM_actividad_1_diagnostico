# Actividad 4.7 — Modelo piloto RF con validación espacial por cuadrantes y GridSearch
# --------------------------------------------------------------------------------------
# Esta etapa separa explícitamente:
#   1) puntos excluidos por cercanía al borde de cuadrantes;
#   2) conjunto de desarrollo para entrenamiento + validación cruzada interna;
#   3) validación independiente por cuadrantes completos retenidos fuera de GridSearchCV.
#
# Unidad espacial de agrupamiento: id_cuadrante. No se usa zona como unidad de split.
# La validación independiente NO participa en la búsqueda de hiperparámetros.

paths:
  modeling_dataset_parquet: data/processed/a4_6_modeling_dataset/tables/modeling_dataset.parquet
  modeling_dataset_csv: data/processed/a4_6_modeling_dataset/tables/modeling_dataset.csv
  feature_columns_txt: data/processed/a4_6_modeling_dataset/tables/selected_feature_columns.txt
  target_columns_txt: data/processed/a4_6_modeling_dataset/tables/target_columns.txt

  # A4.4 contiene pilot_xy_point con geometría de puntos.
  a4_4_gpkg: data/processed/a4_4_predictor_normalization/gpkg/a4_4_point_predictors_normalized.gpkg

  # A4 contiene pilot_quadrant con geometría de cuadrantes.
  a4_gpkg: data/processed/a4_pilot_quadrant_extraction/gpkg/pilot_quadrant_extraction_normalized.gpkg

  output_dir: data/processed/a4_7_rf_gridsearch_spatial_validation

layers:
  points_layer: pilot_xy_point
  quadrants_layer: pilot_quadrant

fields:
  key: xy_group_id
  group: id_cuadrante
  target: id_1_propuesta
  target_label: nivel_1_propuesta
  homologated_target_fields:
    - id_0_propuesta
    - id_1_propuesta

  # Campos que nunca deben entrar como predictores.
  non_predictor_fields:
    - xy_group_id
    - id_cuadrante
    - lon
    - lat
    - id_pais_grupo
    - id_0
    - id_1
    - id_2
    - id_0_propuesta
    - nivel_0_propuesta
    - id_1_propuesta
    - nivel_1_propuesta
    - score_aptitud_total
    - categoria_aptitud_preliminar
    - categoria_uso_actividad_1_8
    - definicion_categoria_aptitud
    - accion_recomendada
    - razon_categoria_aptitud
    - distance_to_quadrant_border_m
    - border_excluded

row_filter:
  required_non_null_target: true

  # Mantener en false hasta definir formalmente qué categorías de xy_accion entran.
  use_action_filter: false
  action_field: categoria_uso_actividad_1_8
  allowed_action_values: []

spatial_filter:
  # Filtro conservador para reducir leakage espacial entre cuadrantes vecinos.
  exclude_near_quadrant_border: true
  border_distance_m: 1000

  # Excluye puntos a menos de border_distance_m del borde del cuadrante propio.
  # La unidad espacial sigue siendo id_cuadrante.
  method: own_quadrant_boundary

  # auto estima un CRS UTM local desde los puntos. También puede usarse EPSG:xxxx.
  metric_crs: auto

independent_validation:
  enabled: true

  # Método recomendado para pilotos:
  # genera múltiples candidatos por StratifiedGroupKFold usando id_cuadrante como grupo
  # y selecciona el holdout con mejor balance de clases y tamaño.
  method: optimized_stratified_group_holdout

  # Si se llena, estos cuadrantes quedan como validación independiente y se ignora la optimización.
  explicit_group_ids: []

  # Si se define, usa directamente ese candidato generado, por ejemplo: seed_42_fold_3.
  selected_candidate_id: null

  # Fracción deseada aproximada de puntos/cuadrantes para validación independiente.
  holdout_fraction: 0.20

  # Número de folds candidatos por semilla. Un fold completo queda como validación independiente.
  n_candidate_splits: 5

  # Número de repeticiones con semillas consecutivas. Candidatos totales aprox = repeats × n_candidate_splits.
  n_random_repeats: 50
  shuffle: true
  random_state: 42

  optimization:
    distribution_weight: 1.0
    row_fraction_weight: 2.0
    group_fraction_weight: 1.0
    missing_independent_class_weight: 2.0
    missing_development_class_weight: 100.0
    low_development_support_weight: 20.0
    low_independent_support_weight: 1.0
    min_development_points_per_class: 1
    min_independent_points_per_class: 1

inner_cv:
  # Validación interna usada por GridSearchCV dentro del conjunto de desarrollo.
  # Entrenamiento y validación se separan por cuadrantes completos.
  method: stratified_group_kfold
  # Prueba rápida. Para la corrida definitiva puede volver a 5.
  n_splits: 3
  shuffle: true
  random_state: 42

model:
  algorithm: random_forest
  random_state: 42
  n_jobs: -1
  class_weight: balanced_subsample
  imputer_strategy: median
  oob_score: false

grid_search:
  enabled: true
  scoring:
    accuracy: accuracy
    balanced_accuracy: balanced_accuracy
    f1_macro: f1_macro
    f1_weighted: f1_weighted
  refit: f1_macro
  n_jobs: -1
  verbose: 2
  return_train_score: true
  error_score: raise

  # Modo prueba: una sola combinación, evaluada con los 3 folds anteriores.
  # Esto permite comprobar el flujo completo sin lanzar una búsqueda costosa.
  param_grid:
    clf__n_estimators: [30]
    clf__max_depth: [15]
    clf__min_samples_split: [2]
    clf__min_samples_leaf: [1]
    clf__max_features: [sqrt]

  # Malla amplia de referencia para una corrida posterior:
  # param_grid:
  #   clf__n_estimators: [300, 500]
  #   clf__max_depth: [null, 20, 40]
  #   clf__min_samples_split: [2, 8]
  #   clf__min_samples_leaf: [1, 3]
  #   clf__max_features: [sqrt, 0.5]

outputs:
  report_md: reports/a4_7_rf_gridsearch_spatial_validation_report.md

  # Modelo usado para reportar la validación independiente.
  # Está entrenado SOLO con el conjunto de desarrollo.
  model_development_path: models/rf_id_1_propuesta_best_development.joblib

  # Opcional: después de evaluar la validación independiente, entrenar otro modelo con todo lo modelable.
  # Este modelo NO debe usarse para reportar la validación independiente.
  train_final_model_on_modelable_after_independent_eval: false
  model_all_modelable_path: models/rf_id_1_propuesta_best_all_modelable.joblib
