# Actividad 4.7 — Modelo piloto RF con evaluación espacial por cuadrantes y GridSearch
# -----------------------------------------------------------------------------------
# Objetivo: evaluar el desempeño predictivo del modelo, no la exactitud del producto
# cartográfico.
#
# Esta etapa separa explícitamente:
#   1) puntos opcionalmente excluidos por cercanía al borde de cuadrantes;
#   2) conjunto de desarrollo para entrenamiento + validación cruzada interna;
#   3) holdout independiente formado por cuadrantes completos y retenido fuera
#      de GridSearchCV.
#
# Unidad espacial de agrupamiento: id_cuadrante. No se usa zona como unidad de split.
# La validación independiente NO participa en la búsqueda de hiperparámetros.

paths:
  modeling_dataset_parquet: data/processed/a4_6_modeling_dataset/tables/modeling_dataset.parquet
  modeling_dataset_csv: data/processed/a4_6_modeling_dataset/tables/modeling_dataset.csv
  feature_columns_txt: data/processed/a4_6_modeling_dataset/tables/selected_feature_columns.txt
  target_columns_txt: data/processed/a4_6_modeling_dataset/tables/target_columns.txt

  # A4.4 contiene pilot_xy_point con geometría de puntos.
  a4_4_gpkg: data/processed/a4_4_predictor_normalization/gpkg/a4_4_point_predictors_normalized.gpkg

  # A4 contiene pilot_quadrant con geometría de cuadrantes.
  a4_gpkg: data/processed/a4_pilot_quadrant_extraction/gpkg/pilot_quadrant_extraction_normalized.gpkg

  output_dir: data/processed/a4_7_rf_gridsearch_spatial_validation

layers:
  points_layer: pilot_xy_point
  quadrants_layer: pilot_quadrant

fields:
  key: xy_group_id
  group: id_cuadrante
  target: id_1_propuesta
  target_label: nivel_1_propuesta

  homologated_target_fields:
    - id_0_propuesta
    - id_1_propuesta

  # Campos que nunca deben entrar como predictores.
  non_predictor_fields:
    - xy_group_id
    - id_cuadrante
    - lon
    - lat
    - id_pais_grupo
    - id_0
    - id_1
    - id_2
    - id_0_propuesta
    - nivel_0_propuesta
    - id_1_propuesta
    - nivel_1_propuesta
    - score_aptitud_total
    - categoria_aptitud_preliminar
    - categoria_uso_actividad_1_8
    - definicion_categoria_aptitud
    - accion_recomendada
    - razon_categoria_aptitud
    - distance_to_quadrant_border_m
    - border_excluded

row_filter:
  required_non_null_target: true

  # Mantener en false hasta definir formalmente qué categorías de xy_accion entran.
  use_action_filter: false
  action_field: categoria_uso_actividad_1_8
  allowed_action_values: []

spatial_filter:
  # INTERRUPTOR DEL UMBRAL DE BORDE:
  #   true  = aplica el umbral indicado en border_distance_m;
  #   false = no calcula distancias y no excluye puntos por cercanía al borde.
  #
  # El filtro se conserva como opción de sensibilidad. El valor de 1 km no se
  # interpreta como una distancia de autocorrelación demostrada.
  exclude_near_quadrant_border: false

  # Solo se utiliza cuando exclude_near_quadrant_border es true.
  border_distance_m: 1000

  # Excluye puntos situados a menos de border_distance_m del borde de su
  # cuadrante propio. La unidad espacial sigue siendo id_cuadrante.
  method: own_quadrant_boundary

  # auto estima un CRS UTM desde los puntos. También puede usarse EPSG:xxxx.
  metric_crs: auto

independent_validation:
  enabled: true

  # Genera cinco candidatos mediante StratifiedGroupKFold, manteniendo cada
  # cuadrante completo. Selecciona el candidato válido con la distribución de
  # clases y fracción de puntos más próximas al conjunto total.
  method: stratified_group_holdout

  # Si se especifican cuadrantes, se utilizan directamente como holdout y se
  # omite la selección automática.
  explicit_group_ids: []

  # Permite congelar uno de los candidatos generados, por ejemplo:
  # seed_42_fold_3. Con null, el código selecciona automáticamente.
  selected_candidate_id: null

  # Fracción aproximada deseada para el holdout.
  holdout_fraction: 0.20

  # Con cinco particiones, cada candidato representa aproximadamente 20 %.
  n_candidate_splits: 5
  shuffle: true
  random_state: 42

inner_cv:
  # Validación interna usada por GridSearchCV dentro del conjunto de desarrollo.
  # Entrenamiento y validación se separan por cuadrantes completos.
  method: stratified_group_kfold

  # PRUEBA RÁPIDA. Cambiar a 5 para la corrida definitiva.
  n_splits: 3
  shuffle: true
  random_state: 42

model:
  algorithm: random_forest
  random_state: 42
  n_jobs: -1
  class_weight: balanced_subsample
  imputer_strategy: median
  oob_score: false

grid_search:
  scoring:
    accuracy: accuracy
    balanced_accuracy: balanced_accuracy
    f1_macro: f1_macro
    f1_weighted: f1_weighted

  # Métrica principal para seleccionar la mejor combinación.
  refit: f1_macro

  n_jobs: -1
  verbose: 2
  return_train_score: true
  error_score: raise

  # MODO PRUEBA: una sola combinación evaluada con los tres folds anteriores.
  # Sirve para comprobar el flujo completo sin lanzar una búsqueda costosa.
  param_grid:
    clf__n_estimators: [30]
    clf__max_depth: [15]
    clf__min_samples_split: [2]
    clf__min_samples_leaf: [1]
    clf__max_features: ["sqrt"]

  # MALLA AMPLIA PARA LA CORRIDA DEFINITIVA:
  # Sustituir el bloque param_grid anterior por este bloque y cambiar
  # inner_cv.n_splits a 5.
  #
  # param_grid:
  #   clf__n_estimators: [300, 500]
  #   clf__max_depth: [null, 20, 40]
  #   clf__min_samples_split: [2, 8]
  #   clf__min_samples_leaf: [1, 3]
  #   clf__max_features: ["sqrt", 0.5]

outputs:
  report_md: reports/a4_7_rf_gridsearch_spatial_validation_report.md

  # Modelo utilizado para reportar la evaluación independiente. Está entrenado
  # exclusivamente con el conjunto de desarrollo.
  model_development_path: models/rf_id_1_propuesta_best_development.joblib

  # Opcional: después de evaluar el holdout, entrenar otro modelo con todos los
  # datos modelables. Este modelo no se usa para reportar el holdout.
  train_final_model_on_modelable_after_independent_eval: false
  model_all_modelable_path: models/rf_id_1_propuesta_best_all_modelable.joblib