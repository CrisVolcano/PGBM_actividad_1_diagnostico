project:
  name: "PGBM_actividad_1_diagnostico"
  module: "A3 caso SINAC - replica A1 con homologacion tematica"
  source_description: "SINAC - Malla de Entrenamientos del Mapa de Bosques 2021, Costa Rica"
  methodological_reference: "Actividad 1 - auditorias integradas y scoring multicriterio"

paths:
  project_root: "../../.."

preparation:
  input_gpkg: "data/processed/a3_auditorias_nuevas_fuentes/raw/muestras_guanacaste_zonas_cuadrantes.gpkg"
  input_layer: null
  output_gpkg: "data/processed/a3_auditorias_nuevas_fuentes/caso_SINAC/preparacion/preparacion_sinac_src10_2021.gpkg"
  output_layer: "preparacion_sinac_src10_2021"

input_data:
  gpkg_file: "data/processed/a3_auditorias_nuevas_fuentes/caso_SINAC/homologacion_a1/sinac_src10_2021_homologado_a1.gpkg"
  gpkg_layer: "sinac_src10_2021_homologado_a1"

fields:
  id: "id_registro"
  original_id: "id_muestra_original"
  xy_group_id: "xy_group_id"
  xy_year_group_id: "xy_year_group_id"
  xy_class_group_id: "xy_class_group_id"
  extract_id: "extract_id"
  source: "Fuente"
  source_id: "id_fuente"
  year: "Año"
  country: "Pais_es"
  country_code: "Pais_cod3"
  longitude: "Longitud"
  latitude: "Latitud"
  class_code: "id_nivel_2"
  class_group_code: "id_nivel_1"
  class_name: "nivel_2"
  class_group_name: "nivel_1"
  original_class_code: "Clase"
  original_class_group_code: "GranClase"
  original_class_name: "nombre_clase"
  original_class_group_name: "nombre_gran_clase"
  id_level_0: "id_nivel_0"
  level_0: "nivel_0"
  id_level_1: "id_nivel_1"
  level_1: "nivel_1"
  id_level_2: "id_nivel_2"
  level_2: "nivel_2"

settings:
  expected_crs: "EPSG:4326"
  coordinate_precision: 6
  extract_id_prefix: "S2SR_llenado_SRC10"
  batch_size: 50000

temporal:
  year_min: 2021
  year_max: 2021
  target_year: 2021

homologation_a1:
  input_gpkg: "data/processed/a3_auditorias_nuevas_fuentes/caso_SINAC/preparacion/preparacion_sinac_src10_2021.gpkg"
  input_layer: "preparacion_sinac_src10_2021"
  homologation_csv: "docs/actividad_3/SINAC/homologacion_sinac_a1.csv"
  output_gpkg: "data/processed/a3_auditorias_nuevas_fuentes/caso_SINAC/homologacion_a1/sinac_src10_2021_homologado_a1.gpkg"
  output_layer: "sinac_src10_2021_homologado_a1"
  tables_dir: "outputs/tables/a3_auditorias_nuevas_fuentes/caso_SINAC/homologacion_a1"
  report_md: "outputs/reports/a3_auditorias_nuevas_fuentes/caso_SINAC/homologacion_a1/homologacion_sinac_src10_2021_a1.md"
  fail_on_unmatched: true

outputs:
  base_dir: "data/processed/a3_auditorias_nuevas_fuentes/caso_SINAC/gee_input"
  tables_dir: "outputs/tables/a3_auditorias_nuevas_fuentes/caso_SINAC/gee_input"
  report_md: "outputs/reports/a3_auditorias_nuevas_fuentes/caso_SINAC/gee_input/s2_sr_gee_input_sinac_src10_2021.md"
  logs_dir: "logs/a3_auditorias_nuevas_fuentes/caso_SINAC"
  units_csv: "s2_sr_extract_units_sinac_src10_2021.csv"
  eligible_gpkg: "puntos_sinac_src10_2021_con_extract_id.gpkg"
  eligible_layer: "puntos_sinac_src10_2021_con_extract_id"
  overwrite: true

xy_groups:
  enabled: true
  id_namespace: "SRC10_CRI_2021_A1"
  id_strategy: "hash"
  hash_length: 12
  coordinate_precision: 6
  input_gpkg: "data/processed/a3_auditorias_nuevas_fuentes/caso_SINAC/homologacion_a1/sinac_src10_2021_homologado_a1.gpkg"
  input_layer: "sinac_src10_2021_homologado_a1"
  output_gpkg: "data/processed/a3_auditorias_nuevas_fuentes/caso_SINAC/xy_groups/sinac_src10_2021_xy_groups_outputs.gpkg"
  output_layers:
    records: "sinac_src10_records_with_xy_groups"
    xy_groups: "sinac_src10_xy_groups"
    xy_year_groups: "sinac_src10_xy_year_groups"
    xy_class_groups: "sinac_src10_xy_class_groups"
  tables_dir: "outputs/tables/a3_auditorias_nuevas_fuentes/caso_SINAC/xy_groups"
  report_md: "outputs/reports/a3_auditorias_nuevas_fuentes/caso_SINAC/xy_groups/xy_groups_sinac_src10_2021_report.md"
  use_for_gee_input: true

s2sr_join:
  input_gpkg: "data/processed/a3_auditorias_nuevas_fuentes/caso_SINAC/gee_input/puntos_sinac_src10_2021_con_extract_id.gpkg"
  input_layer: "puntos_sinac_src10_2021_con_extract_id"
  gee_export_dir: "data/processed/a3_auditorias_nuevas_fuentes/caso_SINAC/gee_exports"
  gee_export_prefix: "pgbm_s2sr_monthly_s2cloudless_sinac_src10_2021"
  output_gpkg: "data/processed/a3_auditorias_nuevas_fuentes/caso_SINAC/s2sr_join/sinac_src10_2021_s2sr_join_outputs.gpkg"
  tables_dir: "outputs/tables/a3_auditorias_nuevas_fuentes/caso_SINAC/s2sr_join"
  report_md: "outputs/reports/a3_auditorias_nuevas_fuentes/caso_SINAC/s2sr_join/join_s2sr_to_sinac_src10_2021_records_report.md"

spectral_class_audit:
  input_gpkg: "data/processed/a3_auditorias_nuevas_fuentes/caso_SINAC/s2sr_join/sinac_src10_2021_s2sr_join_outputs.gpkg"
  input_layers:
    original_annual: "sinac_src10_records_s2sr_annual"
    extract_units_annual: "sinac_src10_extract_units_s2sr_annual"
  output_dir: "data/processed/a3_auditorias_nuevas_fuentes/caso_SINAC/spectral_class_audit"
  output_gpkg: "data/processed/a3_auditorias_nuevas_fuentes/caso_SINAC/spectral_class_audit/s2sr_spectral_class_audit_sinac_src10_2021_outputs.gpkg"
  tables_dir: "outputs/tables/a3_auditorias_nuevas_fuentes/caso_SINAC/spectral_class_audit"
  reports_dir: "outputs/reports/a3_auditorias_nuevas_fuentes/caso_SINAC/spectral_class_audit"
  report_md: "outputs/reports/a3_auditorias_nuevas_fuentes/caso_SINAC/spectral_class_audit/s2sr_spectral_class_audit_sinac_src10_2021_report.md"

quality_scoring_a1:
  output_gpkg: "data/processed/a3_auditorias_nuevas_fuentes/caso_SINAC/scoring_a1/sinac_src10_2021_scoring_a1_outputs.gpkg"
  output_layer: "xy_group_quality_scoring"
  tables_dir: "outputs/tables/a3_auditorias_nuevas_fuentes/caso_SINAC/scoring_a1"
  report_md: "outputs/reports/a3_auditorias_nuevas_fuentes/caso_SINAC/scoring_a1/scoring_a1_sinac_src10_2021_report.md"
  target_year: 2021
  source_base_score: 85
  confidence_method: "derivado_a3_sin_conf_integrada"
  confidence_formula:
    source: 0.35
    semantic_clarity: 0.25
    class_consistency: 0.20
    spatial: 0.20
  min_records_moderate_class: 100
  min_records_sufficient_class: 500
  weights_xy:
    temporal: 0.20
    spatial: 0.20
    thematic: 0.20
    spectral: 0.15
    confidence: 0.10
    representativity: 0.10
    source: 0.05
  spectral_scores:
    sin_alerta: 100
    baja: 80
    media: 60
    alta: 30
    alta_sin_datos: 10
  representativity_scores:
    suficiente: 100
    moderado: 85
    bajo: 65
    critico: 40
  state_thresholds:
    training_high: 85
    training_conditioned: 70
    contextual: 55
  caps:
    spectral_alert_high: 70
    spectral_no_data: 60
    semantic_residual: 75
  semantic_keywords:
    residual:
      - "otra"
      - "otras"
      - "sin clasificar"
      - "no clasificado"
