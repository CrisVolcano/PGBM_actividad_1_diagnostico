  fields:
    target: id_1_propuesta
    target_label: nivel_1_propuesta

  models:
    - model_id: linear_parsimonious
      model_name: SVM lineal parsimonioso
      configuration: LinearSVC(C=10.0, class_weight=None)
      result_dir: data/processed/a4_8_svm/03_train_linear_svm_gridsearch
      best_params_json: tables/linear_svm_best_params.json
      cv_overall_metrics_csv: tables/linear_svm_cv_overall_metrics.csv
