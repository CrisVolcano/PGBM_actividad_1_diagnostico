      independent_class_metrics_csv: tables/linear_svm_independent_class_metrics.csv
      independent_confusion_csv: tables/linear_svm_independent_confusion_matrix.csv
      model_path: models/linear_svm_id_1_propuesta_best_development.joblib
      recommendation_role: lineal_refinado

    - model_id: nystroem_rbf_initial
      model_name: SVM Nystroem RBF inicial
      configuration: Nystroem(RBF, gamma=0.001, n_components=300) + LinearSVC(C=30.0)
      result_dir: data/processed/a4_8_svm/04_train_nystroem_rbf_svm
      best_params_json: tables/nystroem_rbf_svm_best_params.json
      cv_overall_metrics_csv: tables/nystroem_rbf_svm_cv_overall_metrics.csv
      independent_metrics_csv: tables/nystroem_rbf_svm_independent_metrics.csv
      independent_class_metrics_csv: tables/nystroem_rbf_svm_independent_class_metrics.csv
      independent_confusion_csv: tables/nystroem_rbf_svm_independent_confusion_matrix.csv
      model_path: models/nystroem_rbf_svm_id_1_propuesta_best_development.joblib
      recommendation_role: costo_beneficio

    - model_id: nystroem_rbf_refined
      model_name: SVM Nystroem RBF refinado
      configuration: Nystroem(RBF, gamma=0.003, n_components=600) + LinearSVC(C=30.0)
      result_dir: data/processed/a4_8_svm/04_train_nystroem_rbf_svm_refined
      best_params_json: tables/nystroem_rbf_svm_refined_best_params.json
      cv_overall_metrics_csv: tables/nystroem_rbf_svm_refined_cv_overall_metrics.csv
      independent_metrics_csv: tables/nystroem_rbf_svm_refined_independent_metrics.csv
      independent_class_metrics_csv: tables/nystroem_rbf_svm_refined_independent_class_metrics.csv
      independent_confusion_csv: tables/nystroem_rbf_svm_refined_independent_confusion_matrix.csv
      model_path: models/nystroem_rbf_svm_refined_id_1_propuesta_best_development.joblib
      recommendation_role: mejor_desempeno

  recommendation:
    best_model_id: nystroem_rbf_refined
    cost_benefit_model_id: nystroem_rbf_initial
    linear_baseline_model_id: linear_parsimonious

  outputs:
    final_report_md: a4_8_svm_final_report.md
    model_comparison_csv: a4_8_svm_model_comparison.csv
    recommended_class_metrics_csv: a4_8_svm_recommended_class_metrics.csv
    recommended_top_confusions_csv: a4_8_svm_recommended_top_confusions.csv
